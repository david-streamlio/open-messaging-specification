syntax = "proto3";

package streamqos;

import "google/protobuf/timestamp.proto";

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  KAFKA = 1;
  PULSAR = 2;
  MQTT = 3;
  WEBSOCKETS = 4;
}

enum TopicState {
  TOPIC_STATE_UNSPECIFIED = 0;
  ACTIVE = 1;
  PROVISIONING = 2;
  SHUTTING_DOWN = 3;
  ERROR = 4;
}

enum StorageType {
  STORAGE_TYPE_UNSPECIFIED = 0;
  OBJECT_STORAGE = 1;
  ATTACHED_STORAGE = 2;
  EPHEMERAL = 3;
  NVME = 4;
}

enum StorageFormat {
  STORAGE_FORMAT_UNSPECIFIED = 0;
  JSON = 1;
  AVRO = 2;
  BYTES = 3;
  LAKEHOUSE = 4;
}

message QuantileMetrics {
  double p50 = 1;
  double p95 = 2;
  double p99 = 3;
}

message QoSRequest {
  string topic_name = 1;
  QuantileMetrics latency_ms = 2;
  QuantileMetrics throughput_mb_per_sec = 3;
  double min_availability_percent = 4;
  double max_cost_per_gb = 5;
  repeated Protocol supported_protocols = 6;
  repeated string features = 7;
  StorageType preferred_storage = 8;
  int32 az_failure_tolerance = 9;
  StorageFormat storage_format = 10;
  string notify_url = 11;
}

message QoSOffer {
  string topic_name = 1;
  string cluster_id = 2;
  TopicState topic_state = 3;
  QuantileMetrics latency_ms = 4;
  QuantileMetrics throughput_mb_per_sec = 5;
  double availability_percent = 6;
  double cost_per_gb = 7;
  repeated Protocol supported_protocols = 8;
  repeated string features = 9;
  StorageType assigned_storage = 10;
  int32 assigned_az_failure_tolerance = 11;
  StorageFormat assigned_storage_format = 12;
  google.protobuf.Timestamp estimated_ready_time = 13;
  string reason = 14;
}

message QoSDecision {
  string topic_name = 1;
  oneof decision {
    bool accept = 2;
    bool reject = 3;
  }
}
